<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="name desc">
<title id="name">HollowImport</title><desc id="desc">A solid code-filled package opens into an empty replica. Reproduce Node.js import failures without sharing the private source.</desc>
