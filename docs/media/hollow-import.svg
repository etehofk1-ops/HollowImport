<g fill="#143e32" font-family="system-ui,Segoe UI,Arial,sans-serif"><text x="48" y="145" font-size="91" font-weight="750" letter-spacing="-5.8">HollowImport</text><text x="54" y="202" font-weight="500" font-size="31" letter-spacing="-.7">Reproduce a private Node.js import failure.</text></g>
